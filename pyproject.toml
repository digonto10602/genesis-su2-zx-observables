[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "su2zx"
version = "0.3.0"
description = "Observable-preserving ZX compilation for truncated SU(2) plaquette chains"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Md Habib E Islam"}]
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0,<3",
  "pandas>=2.2",
  "pyzx>=0.10,<0.11",
  "qiskit>=2.5,<3",
  "qiskit-aer>=0.17,<1",
  "scikit-learn>=1.6",
  "scipy>=1.14"
]

[project.optional-dependencies]
ibm = ["mthree>=3,<4", "qiskit-ibm-runtime>=0.49,<1"]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[project.scripts]
su2zx-study = "su2zx.study:main"
su2zx-compiler = "su2zx.compiler_study:main"
su2zx-report = "su2zx.report:main"
su2zx-qpu = "su2zx.qpu:main"
su2zx-qpu-analysis = "su2zx.qpu_analysis:main"
su2zx-tn = "su2zx.tn_study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["zip_results/"]
