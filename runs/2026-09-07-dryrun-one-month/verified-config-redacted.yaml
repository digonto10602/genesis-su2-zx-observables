model:
  default: gpt-6-astra
  provider: openai-codex
  openai_runtime: auto
fallback_providers:
- provider: nvidia
  model: moonshotai/kimi-k3
- provider: nvidia
  model: deepseek-ai/deepseek-v4-pro-0813
- provider: nvidia
  model: nvidia/nemotron-3-ultra-550b-a55b
